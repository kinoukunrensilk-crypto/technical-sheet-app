name = "technical-sheet-app"
main = "src/index.js"
compatibility_date = "2024-09-23"

# 静的アセット（HTML/CSS/JS）の配信
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 データベースバインディング
[[d1_databases]]
binding = "DB"
database_name = "technical_sheet_db"
database_id = "technical_sheet_db" # 実際のIDに更新、またはローカル開発用
migrations_table = "d1_migrations"
